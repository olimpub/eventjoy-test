<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <title>Oklevél előnézet</title>
  <style>
    html, body {
      margin: 0;
      background: #020617;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    canvas {
      width: 92vw;
      max-height: 92vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <canvas id="c" width="1754" height="1240"></canvas>
  <script>
    const PX_W = 1754, PX_H = 1240;
    const FONT = 'Poppins, "Segoe UI", Roboto, sans-serif';
    const input = {
      personName: 'Kovács János',
      eventName: 'OPTA 2026',
      eventDateLabel: '2026. szeptember 14.',
      roleName: 'Játékos',
    };

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function wrapText(ctx, text, maxWidth, maxLines) {
      const words = text.split(/\s+/).filter(Boolean);
      const lines = [];
      let line = '';
      for (const word of words) {
        const next = line ? line + ' ' + word : word;
        if (ctx.measureText(next).width > maxWidth && line) {
          lines.push(line);
          line = word;
          if (lines.length === maxLines) break;
        } else line = next;
      }
      if (line && lines.length < maxLines) lines.push(line);
      return lines;
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    (async () => {
      const ctx = document.getElementById('c').getContext('2d');
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, PX_W, PX_H);

      const inset = 48;
      roundRect(ctx, inset, inset, PX_W - inset * 2, PX_H - inset * 2, 28);
      ctx.fillStyle = '#111827';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#fbbf24';
      ctx.stroke();

      roundRect(ctx, inset + 18, inset + 18, PX_W - (inset + 18) * 2, PX_H - (inset + 18) * 2, 18);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.stroke();

      const cx = PX_W / 2;
      const logo = await loadImage('/PTA.png');
      if (logo && logo.naturalWidth > 0) {
        const maxW = 720;
        const maxH = 180;
        const scale = Math.min(maxW / logo.naturalWidth, maxH / logo.naturalHeight);
        const logoW = logo.naturalWidth * scale;
        const logoH = logo.naturalHeight * scale;
        ctx.drawImage(logo, cx - logoW / 2, 108, logoW, logoH);
      }

      ctx.textAlign = 'center';
      ctx.fillStyle = '#fbbf24';
      ctx.font = '800 22px ' + FONT;
      ctx.fillText('OKLEVÉL', cx, 328);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 22px ' + FONT;
      ctx.fillText('Ezen oklevél tanúsítja, hogy', cx, 400);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 56px ' + FONT;
      let y = 490;
      for (const line of wrapText(ctx, input.personName, PX_W - 280, 2)) {
        ctx.fillText(line, cx, y);
        y += 64;
      }

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 22px ' + FONT;
      ctx.fillText('részt vett a(z)', cx, y + 16);

      ctx.fillStyle = '#7dd3fc';
      ctx.font = '800 36px ' + FONT;
      y += 80;
      for (const line of wrapText(ctx, input.eventName, PX_W - 280, 3)) {
        ctx.fillText(line, cx, y);
        y += 46;
      }

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 22px ' + FONT;
      ctx.fillText('eseményen.', cx, y + 8);

      y += 100;
      ctx.fillStyle = '#fbbf24';
      ctx.font = '800 52px ' + FONT;
      ctx.fillText('3. helyezés', cx, y);
      y += 70;
      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 18px ' + FONT;
      ctx.fillText('Pontszám', cx, y);
      ctx.fillStyle = '#7dd3fc';
      ctx.font = '800 48px ' + FONT;
      ctx.fillText('118 000', cx, y + 56);

      ctx.fillStyle = '#fbbf24';
      ctx.font = '700 20px ' + FONT;
      ctx.fillText(input.eventDateLabel + '  ·  ' + input.roleName, cx, PX_H - 110);
    })();
  </script>
</body>
</html>
